<div id="invite_modal_body" class="space-y-4">

    <p class="text-gray-800 dark:text-gray-200">
        Invitation for <strong>{{ email }}</strong> has been created.
        <br>
        (Email sending is out of scope — printed in console.)
    </p>

    <div class="flex justify-end">
        <button
            onclick="document.getElementById('invite_modal').remove()"
            class="py-2 px-4 rounded-lg bg-primary text-white hover:bg-primary-700"
        >
            Close
        </button>
    </div>

</div>
